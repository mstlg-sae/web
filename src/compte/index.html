<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connection - BIT//ARCADE</title>
  <link rel="stylesheet" href="./../assets/style.css">
</head>
<body>
  <header>
    <div class="conteneur">
      <a class="logo" href="./../index.html">
        <img src="./../assets/logo.png" alt="Logo BIT//ARCADE">
        <span>BIT//ARCADE</span>
      </a>
      <nav>
        <a href="./../index.html">Accueil</a>
        <a href="./../jeux/index.html">Jeux</a>
        <a href="connection.html" class="actif">Connection</a>
        <a href="profil.html">Profil</a>
        <a href="./../about/index.html">A propos</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="conteneur">
      <form class="formulaire" action="#" method="post">
        <h1>Connexion.</h1>
        <div class="champ">
          <label>Identifiant</label>
          <input type="text" id="identifiant" name="identifiant" required>
        </div>
        <div class="champ">
          <label>Mot de passe</label>
          <input type="text" id="mdp" name="mdp" required>
        </div>
        <button class="bouton" type="submit" style="width:100%">Se connecter</button>
        <p class="bas">Pas de compte ? <a href="inscription.html">Créer un compte</a></p>
      </form>
    </div>
  </main>
  <footer>
    <div class="conteneur">
      <span>BIT//ARCADE</span>
      <span class="page">connection.html</span>
    </div>
  </footer>
</body>
</html>
