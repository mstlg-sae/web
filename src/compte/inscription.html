<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - BIT//ARCADE</title>
  <link rel="stylesheet" href="./../assets/style.css">
</head>
<body>
  <header>
    <div class="conteneur">
      <a class="logo" href="./../index.html">
        <img src="./../assets/logo.png" alt="Logo BIT//ARCADE">
        <span>BIT//ARCADE</span>
      </a>
      <nav>
        <a href="./../index.html">Accueil</a>
        <a href="./../jeux/index.html">Jeux</a>
        <a href="./index.html" class="actif">Connection</a>
        <a href="profil.html">Profil</a>
        <a href="./../about/index.html">A propos</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="conteneur">
      <form class="formulaire" action="#" method="post">
        <p class="etiquette">Nouveau joueur</p>
        <h1>Inscription.</h1>
        <div class="champ">
          <label for="pseudo">Pseudo</label>
          <input type="text" id="pseudo" name="pseudo">
        </div>
        <div class="champ">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" name="mdp">
        </div>
        <div class="champ">
          <label for="mdp2">Confirmer le mot de passe</label>
          <input type="password" id="mdp2" name="mdp2">
        </div>
        <button class="bouton" type="submit" style="width:100%">Créer mon compte →</button>
        <p class="bas">Déjà un compte ? <a href="inscription.html">Se connecter</a></p>
      </form>
    </div>
  </main>
  <footer>
    <div class="conteneur">
      <span>BIT//ARCADE</span>
      <span class="page">compte/inscription.html</span>
    </div>
  </footer>
</body>
</html>
